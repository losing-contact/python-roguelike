<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 610" role="img" aria-labelledby="title desc"><title id="title">Жизненный цикл приложения</title><desc id="desc">start → menu: curses.wrapper; menu → new: new; menu → cont: continue; menu → rec: records; menu → exit: выход; new → play: ; cont → play: ; play → finish: q / конец / малое окно; finish → menu: возврат; rec → menu: назад</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><path d="M360,67 L405,67" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="60.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">curses.wrapper</text><path d="M570,109 L195,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">new</text><path d="M570,109 L570,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">continue</text><path d="M570,109 L945,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="757.5" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">records</text><path d="M735,67 L780,67" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="757.5" y="60.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">выход</text><path d="M195,254 L570,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M570,254 L570,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M570,399 L570,460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="422.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">q / конец / малое окно</text><path d="M735,520 H779 V85 H735" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="773" y="302.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">возврат</text><path d="M1110,230 H1134 V85 H735" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1128" y="157.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">назад</text><rect x="30" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="39" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">main(--seed N)</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">Random → фабрика GameSession</text><rect x="405" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="39" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Главное меню</text><text x="423" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">Сначала load_session()</text><rect x="30" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="184" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Новая игра</text><text x="48" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">Новая сессия и первый уровень</text><rect x="405" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="184" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Продолжить</text><text x="423" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">Сессия из save.json</text><rect x="780" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="780" y="184" width="4" height="56" rx="2" fill="#9333ea"/><text x="798" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Рекорды</text><text x="798" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">top_records() → экран</text><rect x="405" y="315" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="329" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="347" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">play(session, repo)</text><text x="423" y="374" font-family="Arial,sans-serif" font-size="13" fill="#475569">Цикл ввода и отрисовки</text><rect x="405" y="460" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="474" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="492" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">finish()</text><text x="423" y="519" font-family="Arial,sans-serif" font-size="13" fill="#475569">Сохранение или итог</text><rect x="780" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="780" y="39" width="4" height="56" rx="2" fill="#9333ea"/><text x="798" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Выход</text><text x="798" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">Возврат из run()</text></svg>