<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 755" role="img" aria-labelledby="title desc"><title id="title">Сохранение, загрузка и рекорды</title><desc id="desc">finish → save: игра продолжается; finish → record: игра завершена; save → json: перезапись; record → records: добавление; json → load: чтение; load → session: восстановление; records → top: сортировка</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><path d="M570,109 L195,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">игра продолжается</text><path d="M570,109 L945,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="757.5" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">игра завершена</text><path d="M195,254 L195,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="195.0" y="277.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">перезапись</text><path d="M945,254 L945,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="945.0" y="277.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">добавление</text><path d="M195,399 L195,460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="195.0" y="422.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">чтение</text><path d="M195,544 L570,605" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="567.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">восстановление</text><path d="M945,399 L945,460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="945.0" y="422.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">сортировка</text><rect x="405" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="39" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">finish(session, repo)</text><text x="423" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">Проверить GameState</text><rect x="30" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="184" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">PLAYING → save_session</text><text x="48" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">session_to_dict → json.dump</text><rect x="780" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="780" y="184" width="4" height="56" rx="2" fill="#9333ea"/><text x="798" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">WON / LOST</text><text x="798" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">add_record → delete_session</text><rect x="30" y="315" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="329" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="347" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">saves/save.json</text><text x="48" y="374" font-family="Arial,sans-serif" font-size="13" fill="#475569">Снимок текущего уровня</text><rect x="780" y="315" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="780" y="329" width="4" height="56" rx="2" fill="#9333ea"/><text x="798" y="347" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">saves/records.json</text><text x="798" y="374" font-family="Arial,sans-serif" font-size="13" fill="#475569">Список RunStats</text><rect x="30" y="460" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="474" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="492" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">load_session</text><text x="48" y="519" font-family="Arial,sans-serif" font-size="13" fill="#475569">json.load → session_from_dict</text><rect x="405" y="605" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="619" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="637" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">GameSession(...)</text><text x="423" y="664" font-family="Arial,sans-serif" font-size="13" fill="#475569">PLAYING, новый RNG, новый обзор</text><rect x="780" y="460" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="780" y="474" width="4" height="56" rx="2" fill="#9333ea"/><text x="798" y="492" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">top_records(10)</text><text x="798" y="519" font-family="Arial,sans-serif" font-size="13" fill="#475569">Сокровища ↓, глубина ↓</text></svg>