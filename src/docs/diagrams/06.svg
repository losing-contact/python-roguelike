<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 465" role="img" aria-labelledby="title desc"><title id="title">Генерация уровня: геометрия и проверка</title><desc id="desc">rooms → links: ; links → paint: ; paint → bfs: геометрия корректна; bfs → exit: центры достижимы; exit → pop: ; pop → valid: ; valid → ok: нет проблем; valid → retry: есть проблемы; paint → retry: ValueError; bfs → retry: нет пути; retry → rooms: повтор</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><path d="M360,67 L405,67" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M735,67 L780,67" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M945,109 L945,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="945.0" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">геометрия корректна</text><path d="M780,212 L735,212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="757.5" y="205.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">центры достижимы</text><path d="M405,212 L360,212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M195,254 L195,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,357 L405,357" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="350.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">нет проблем</text><path d="M360,357 L780,357" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="350.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">есть проблемы</text><path d="M945,109 L945,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="945.0" y="205.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">ValueError</text><path d="M945,254 L945,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="945.0" y="277.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">нет пути</text><path d="M1110,375 H1144 V85 H360" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1138" y="230.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">повтор</text><rect x="30" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="39" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">build_rooms</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">9 комнат в сетке 3 × 3</text><rect x="405" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="39" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">choose_connections</text><text x="423" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">Остов + 0–2 лишних связи</text><rect x="780" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="780" y="39" width="4" height="56" rx="2" fill="#9333ea"/><text x=