<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 755" role="img" aria-labelledby="title desc"><title id="title">Предметы, оружие и временные эффекты</title><desc id="desc">floor → bag: если есть место; bag → use: меню выбора; use → food: ; use → elixir: ; use → scroll: ; use → weapon: особая ветка; elixir → tick: уже в этом ходу; tick → expire: счётчик ≤ 0</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><path d="M360,67 L405,67" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="60.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">если есть место</text><path d="M570,109 L570,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">меню выбора</text><path d="M570,254 L195,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M570,254 L570,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M570,254 L945,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M735,212 L780,212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="757.5" y="205.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">особая ветка</text><path d="M570,399 L570,460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="422.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" strok