<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 755" role="img" aria-labelledby="title desc"><title id="title">Бой: попадание, урон, особенности</title><desc id="desc">attack → first: проверка; first → miss: да, флаг потрачен; first → roll: нет; roll → miss: промах; roll → damage: попадание; damage → drain: проверка; drain → result: ; miss → event: ; result → event: </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><path d="M570,109 L195,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">проверка</text><path d="M195,254 L195,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="195.0" y="277.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">да, флаг потрачен</text><path d="M360,212 L405,212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="205.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">нет</text><path d="M570,254 L195,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="277.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">промах</text><path d="M570,254 L570,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="277.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">попадание</text><path d="M735,357 L780,357" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="757.5" y="350.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">проверка</text><path d="M945,399 L570,460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M195,399 L570,605" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M570,544 L570,605" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="405" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="39" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">resolve_attack</text><text x="423" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">attacker · target · rng</text><rect x="30" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="184" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">FIRST_HIT_MISS?</text><text x="48" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">Первый удар по вампиру</text><rect x="405" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="184" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Проверка случайности</text><text x="423" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">rng.random() ≤ hit_chance</text><rect x="30" y="315" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="329" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="347" font-family="Arial,sans-serif" font-size="17" font-we