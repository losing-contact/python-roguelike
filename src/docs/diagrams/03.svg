<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 755" role="img" aria-labelledby="title desc"><title id="title">Один ход: от клавиши до нового кадра</title><desc id="desc">key → cmd: Move; key → menu: h / j / k / e; menu → cmd: выбор; cmd → act: ; act → world: проверка; world → stats: после хода / без хода; stats → vis: ; vis → draw: возврат событий</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><path d="M195,109 L195,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="195.0" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">Move</text><path d="M360,67 L405,67" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="60.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">h / j / k / e</text><path d="M570,109 L195,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="132.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">выбор</text><path d="M195,254 L195,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M360,357 L405,357" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382.5" y="350.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">проверка</text><path d="M570,399 L570,460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="422.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">после хода / без хода</text><path d="M405,502 L360,502" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M195,544 L195,605" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="195.0" y="567.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="5" paint-order="stroke">возврат событий</text><rect x="30" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="39" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">read_key → translate</text><text x="48" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">WASD / стрелки / RU раскладка</text><rect x="405" y="25" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="39" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="57" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">OpenMenu</text><text x="423" y="84" font-family="Arial,sans-serif" font-size="13" fill="#475569">Выбор предмета → UseItem</text><rect x="30" y="170" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="184" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="202" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Move или UseItem</text><text x="48" y="229" font-family="Arial,sans-serif" font-size="13" fill="#475569">GameSession.handle(command)</text><rect x="30" y="315" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="329" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="347" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Действие игрока</text><text x="48" y="374" font-family="Arial,sans-serif" font-size="13" fill="#475569">Изменение мира + события</text><rect x="405" y="315" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="329" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="347" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">spent и PLAYING?</text><text x="423" y="374" font-family="Arial,sans-serif" font-size="13" fill="#475569">Да → _end_of_turn</text><rect x="405" y="460" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="405" y="474" width="4" height="56" rx="2" fill="#0f766e"/><text x="423" y="492" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">RunStats.record</text><text x="423" y="519" font-family="Arial,sans-serif" font-size="13" fill="#475569">Обработать каждое событие</text><rect x="30" y="460" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="474" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="492" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">_refresh_vision</text><text x="48" y="519" font-family="Arial,sans-serif" font-size="13" fill="#475569">visible и exploration.seen</text><rect x="30" y="605" width="330" height="84" rx="12" fill="white" stroke="#cbd5e1"/><rect x="30" y="619" width="4" height="56" rx="2" fill="#2563eb"/><text x="48" y="637" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Сообщения и кадр</text><text x="48" y="664" font-family="Arial,sans-serif" font-size="13" fill="#475569">format_event → draw</text></svg>